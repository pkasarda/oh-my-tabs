<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>oh-my-tabs</title>
<script src="appearance.js"></script>
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<main class="app" id="app">
  <div class="head">
    <input class="search" id="search" type="search" placeholder="Search tabs, URLs, groups…" autocomplete="off" aria-label="Search tabs" autofocus>
    <button type="button" class="icon-btn" id="close-dups" aria-label="Close duplicates" data-tip="Close duplicates"></button>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="groups" aria-pressed="true">Groups</button>
      <button type="button" data-view="windows" aria-pressed="false">Windows</button>
      <button type="button" data-view="library" aria-pressed="false" hidden>Library</button>
    </div>
    <button type="button" class="icon-btn" id="open-page" data-tip="Open as page" aria-label="Open as page" data-icon="page"></button>
    <button type="button" class="icon-btn" id="settings-button" aria-haspopup="dialog" data-tip="Settings" aria-label="Settings" data-icon="settings"></button>
  </div>
  <div class="results-bar" id="results-bar"></div>
  <div class="body" id="body"></div>
  <div class="undo-bar" id="undo-bar" role="status" hidden><span id="undo-text"></span><button type="button" class="btn" id="undo-button">Undo</button></div>
</main>

<div popover id="menu" class="menu" role="menu" aria-label="Actions"></div>

<div popover="manual" id="tip" class="tip" role="tooltip"></div>

<dialog id="topic-dialog" aria-labelledby="topic-label">
  <form method="dialog">
    <label id="topic-label" class="topic-field">New topic <input id="topic-name" type="text" required maxlength="60" autocomplete="off"></label>
    <div class="dialog-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn" value="ok">Create</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <form method="dialog">
    <button class="btn" value="cancel">Cancel</button>
    <button class="btn danger" value="ok" id="confirm-ok" autofocus>Close tabs</button>
  </form>
</dialog>
</body>
</html>
