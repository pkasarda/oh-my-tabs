<!doctype html>
<html lang="en" class="mono">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full-page layouts</title>
<link rel="icon" href="data:,">
<!-- The extension's own stylesheet, so the preview looks exactly like the product. -->
<link rel="stylesheet" href="../../popup.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr; background: var(--bg); overflow: hidden; }
  .preview-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-family: var(--sans); font-size: 13px; }
  .preview-bar strong { margin-right: 8px; }
  .preview-bar button { border: 1px solid var(--border); background: var(--surface-2); padding: 5px 10px; border-radius: 8px; }
  .preview-bar button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .preview-bar p { flex-basis: 100%; margin: 2px 0 0; color: var(--muted); }
  .stage { min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); padding: 12px 16px 16px; }
  .page { min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .view { min-height: 0; min-width: 0; }

  /* Small badges next to a tab: stale (amber, like the stale group) and duplicate (popup.css .copy-pill). */
  .stale-tag { flex: none; border-radius: 9px; padding: 1px 7px; font-size: 11px; font-weight: 600; background: light-dark(#fef3c7, #3b2a0b); color: light-dark(#b45309, #fbbf24); }
  .age { min-width: 74px; text-align: right; }
  .dragging { opacity: 0.4; }

  /* A and B: kanban columns. */
  .board { display: flex; gap: 12px; height: 100%; padding: 12px; overflow-x: auto; align-items: stretch; }
  .col { flex: 1 0 290px; max-width: 340px; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
  .col.drop { border-color: var(--accent); background: var(--accent-soft); }
  .col-head { display: flex; gap: 8px; align-items: center; padding: 10px 10px 8px 14px; }
  .col-head .win-title { flex: 1; }
  .col-head .g-name { font-size: 14px; }
  .col-body { overflow: auto; display: grid; gap: 6px; align-content: start; padding: 0 8px 8px; flex: 1; }
  .col-new { flex: 0 0 180px; border-style: dashed; align-items: center; justify-content: center; text-align: center; color: var(--muted); }
  .col-new .i { width: 22px; height: 22px; }
  .col-empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .col .row { padding: 6px 6px; }
  .col .row .age { min-width: 0; }
  summary[draggable="true"] { cursor: grab; }
  .card { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: grab; }
  .card:hover { background: var(--raised); }
  .card .t { min-width: 0; flex: 1; display: grid; gap: 1px; }
  .card .title { overflow-wrap: anywhere; }
  .card .url { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .age { text-align: left; }

  /* C: the tree. */
  .tree-view { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tree-top { display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .tree-top .status { margin-left: auto; color: var(--accent); }
  .tree-scroll { overflow: auto; position: relative; padding-bottom: 12px; }
  #tree { outline: none; }
  #tree:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .tr { --lvl: 0; --fav: 20px; display: flex; gap: 8px; align-items: center; min-height: 34px; padding: 3px 12px 3px calc(12px + var(--lvl) * 24px); cursor: pointer; background-image: repeating-linear-gradient(to right, transparent 0 22px, var(--border) 22px 23px, transparent 23px 24px); background-size: calc(var(--lvl) * 24px + 12px) 100%; background-repeat: no-repeat; }
  .tr:hover { background-color: var(--surface-2); }
  .tr.sel { background-color: var(--raised); box-shadow: inset 0 0 0 1px var(--accent); }
  .tr.win { background-color: var(--surface-2); border-top: 1px solid var(--border); font-weight: 600; }
  .tr.grp { font-weight: 600; }
  .tr .chev, .tr .spacer { width: 16px; flex: none; }
  .tr .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11.5px; }
  .tr .mini-stack { --fav: 22px; }
  .tr.suspended .tt { color: var(--muted); }
  .tr.suspended .fav { opacity: 0.45; }
  .tr.collapsed > .chev { rotate: 0deg; }
  .tr:not(.collapsed) > .chev { rotate: 90deg; }
  .tr input[type="checkbox"] { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .bulk { position: sticky; bottom: 12px; width: max-content; max-width: calc(100% - 24px); margin: 12px auto 0; display: flex; gap: 8px; align-items: center; padding: 8px 10px 8px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--raised); box-shadow: var(--shadow); font-size: 13px; }
  .bulk strong { margin-right: 6px; }
  .bulk select { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); cursor: pointer; }

  /* D: split view. */
  .split { display: grid; grid-template-columns: 290px 1fr; min-height: 0; height: 100%; }
  .side { overflow: auto; padding: 6px 8px 16px; border-right: 1px solid var(--border); background: var(--surface-2); }
  .side h3 { display: flex; justify-content: space-between; margin: 14px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .side .item { display: flex; gap: 8px; align-items: center; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px; background: none; text-align: left; }
  .side .item:hover { background: var(--raised); }
  .side .item[aria-current="true"] { background: var(--accent-soft); }
  .side .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .item .n { color: var(--muted); font-size: 12px; }
  .side .item .fav { --fav: 20px; }
  .side .stale-icon { width: 20px; height: 20px; border-radius: 5px; }
  .side .stale-icon .i { width: 13px; height: 13px; }
  .main { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .main-head { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .main-head h2 { margin: 0; font-size: 16px; }
  .main-head .sub { color: var(--muted); font-size: 12.5px; }
  .main-list { overflow: auto; margin: 0; padding: 4px 8px 16px; }
  .roomy .row { --fav: 32px; gap: 14px; padding: 12px 10px; border-bottom: 1px solid var(--border); border-radius: 0; }
  .roomy .row:hover { border-radius: 7px; }
  .roomy .row .url { font-size: 12px; }
</style>
</head>
<body>
<div class="preview-bar">
  <strong>Full page preview</strong>
  <button type="button" data-v="a" aria-pressed="true">A · Kanban: windows</button>
  <button type="button" data-v="b" aria-pressed="false">B · Kanban: library topics</button>
  <button type="button" data-v="c" aria-pressed="false">C · Tree</button>
  <button type="button" data-v="d" aria-pressed="false">D · Split view</button>
  <button type="button" id="reset">Reset data</button>
  <button type="button" id="theme">Light / dark</button>
  <p id="hint"></p>
</div>
<div class="stage"><main class="page" id="app"></main></div>

<script type="module">
// Lucide shapes, copied from popup.js.
const ICONS = {
  chevron: '<path d="m9 18 6-6-6-6"/>',
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  page: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  save: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/><path d="M12 7v6M9 10h6"/>',
  move: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  suspend: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  open: '<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  newWindow: '<rect width="18" height="16" x="3" y="4" rx="2"/><path d="M3 9h18"/><path d="M12 12v5M9.5 14.5h5"/>',
};
const icon = name => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hostOf = url => url.split('/')[0];
function tile(host) {
  let hue = 0;
  for (const char of host) hue = (hue * 31 + char.charCodeAt(0)) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="hsl(${hue} 50% 46%)"/><text x="16" y="22" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="white">${host[0].toUpperCase()}</text></svg>`;
  return `<img class="fav" alt="" src="data:image/svg+xml,${encodeURIComponent(svg)}">`;
}
const ago = days => (days === 0 ? 'today' : days < 7 ? `${days} d ago` : days < 30 ? `${Math.floor(days / 7)} wk ago` : `${Math.floor(days / 30)} mo ago`);
const STALE_DAYS = 7;

// ---------- mock data: windows -> groups -> [title, url, days since last used] ----------
const DEF = [
  ['acme/client & 4 more', [
    ['acme/client', [['Checkout refactor · Pull Request #812', 'github.com/acme/client/pull/812', 0], ['Flaky e2e on CI · Issue #799', 'github.com/acme/client/issues/799', 9], ['acme/client: Web client', 'github.com/acme/client', 1], ['Release notes draft · Wiki', 'github.com/acme/client/wiki/Release-notes', 23], ['Bundle size budget · Issue #650', 'github.com/acme/client/issues/650', 2]]],
    ['Jira · PAY', [['[PAY-1421] Invoice export fails', 'jira.acme.com/browse/PAY-1421', 0], ['[PAY-1388] Retry webhook deliveries', 'jira.acme.com/browse/PAY-1388', 14], ['[PAY-1290] Currency rounding', 'jira.acme.com/browse/PAY-1290', 31]]],
    ['Linear · WEB', [['WEB-210 Dark mode contrast', 'linear.app/acme/issue/WEB-210', 1], ['WEB-198 Tab drag polish', 'linear.app/acme/issue/WEB-198', 3], ['WEB-175 Onboarding copy', 'linear.app/acme/issue/WEB-175', 0]]],
    ['acme.slite.com', [['Onboarding checklist', 'acme.slite.com/app/docs/aB12', 2], ['Incident runbook', 'acme.slite.com/app/docs/cD34', 40], ['Q3 retro notes', 'acme.slite.com/app/docs/eF56', 60]]],
    ['developer.mozilla.org', [['Popover API · MDN', 'developer.mozilla.org/en-US/docs/Web/API/Popover_API', 3], ['CSS anchor positioning · MDN', 'developer.mozilla.org/en-US/docs/Web/CSS/anchor', 12]]],
    ['figma.com', [['Tabs page · Design file', 'figma.com/design/xY12/Tabs-page', 1], ['Icon set · Design file', 'figma.com/design/zQ34/Icon-set', 5], ['Handoff notes · FigJam', 'figma.com/board/kL56/Handoff', 19]]],
    ['news.ycombinator.com', [['Show HN: A tab manager that keeps up', 'news.ycombinator.com/item?id=4242', 18]]],
  ]],
  ['acme/api & 3 more', [
    ['acme/api', [['Add idempotency keys · Pull Request #455', 'github.com/acme/api/pull/455', 0], ['Rate limit middleware · Pull Request #451', 'github.com/acme/api/pull/451', 4], ['acme/api: Billing API', 'github.com/acme/api', 1], ['Migration 0042 · Issue #430', 'github.com/acme/api/issues/430', 16]]],
    ['Jira · PAY', [['[PAY-1421] Invoice export fails', 'jira.acme.com/browse/PAY-1421', 0], ['[PAY-1405] Webhook signature', 'jira.acme.com/browse/PAY-1405', 2]]],
    ['docs.google.com', [['Q4 planning · Sheets', 'docs.google.com/spreadsheets/d/q4plan', 1], ['API changelog · Docs', 'docs.google.com/document/d/api-changelog', 8], ['Pricing notes · Docs', 'docs.google.com/document/d/pricing-notes', 27]]],
    ['postgresql.org', [['Window functions · PostgreSQL docs', 'postgresql.org/docs/current/tutorial-window.html', 5], ['EXPLAIN · PostgreSQL docs', 'postgresql.org/docs/current/sql-explain.html', 20]]],
    ['stackoverflow.com', [['Upsert with ON CONFLICT', 'stackoverflow.com/questions/1109061', 6], ['Retry with exponential backoff', 'stackoverflow.com/questions/1350441', 0]]],
  ]],
  ['nrwl/nx & 2 more', [
    ['nrwl/nx', [['Affected graph perf · Issue #31002', 'github.com/nrwl/nx/issues/31002', 0], ['nrwl/nx: Smart monorepos', 'github.com/nrwl/nx', 1], ['Task pipeline cache · Pull Request #30988', 'github.com/nrwl/nx/pull/30988', 3], ['Release 21.0 notes', 'github.com/nrwl/nx/releases/tag/21.0.0', 12]]],
    ['nx.dev', [['Project graph · Nx docs', 'nx.dev/docs/features/explore-graph', 0], ['Module federation · Nx docs', 'nx.dev/docs/technologies/module-federation', 9]]],
    ['npmjs.com', [['nx · npm', 'npmjs.com/package/nx', 2], ['esbuild · npm', 'npmjs.com/package/esbuild', 21]]],
    ['web.dev', [['Core Web Vitals', 'web.dev/articles/vitals', 5], ['Back/forward cache', 'web.dev/articles/bfcache', 30]]],
  ]],
  ['Reading & docs', [
    ['news.ycombinator.com', [['Show HN: A tab manager that keeps up', 'news.ycombinator.com/item?id=4242', 18], ['Ask HN: How do you tame your tabs?', 'news.ycombinator.com/item?id=4318', 1], ['Hacker News front page', 'news.ycombinator.com/news', 0]]],
    ['web.dev', [['Building a tab manager UI', 'web.dev/articles/tab-ui', 3], ['Popover API', 'web.dev/articles/popover-api', 6]]],
    ['docs.google.com', [['Roadmap · Docs', 'docs.google.com/document/d/roadmap', 0], ['Q4 planning · Sheets', 'docs.google.com/spreadsheets/d/q4plan', 1]]],
    ['youtube.com', [['Talk: Fast UIs without frameworks', 'youtube.com/watch?v=aB3dE', 15], ['Lo-fi mix for focus', 'youtube.com/watch?v=lF0mX', 0]]],
    ['wikipedia.org', [['Tab (interface) · Wikipedia', 'wikipedia.org/wiki/Tab_(interface)', 40], ['Window manager · Wikipedia', 'wikipedia.org/wiki/Window_manager', 41], ['Kanban · Wikipedia', 'wikipedia.org/wiki/Kanban', 62]]],
  ]],
];
// Saved tabs: [title, url, saved N days ago, topic or null].
const SAVED_DEF = [
  ['Feature flags RFC · Discussion #77', 'github.com/acme/client/discussions/77', 12, 'Release 2.0'],
  ['Release checklist · Wiki', 'acme.slite.com/app/docs/gH78', 5, 'Release 2.0'],
  ['[PAY-1290] Currency rounding', 'jira.acme.com/browse/PAY-1290', 0, 'Release 2.0'],
  ['Bundle size budget · Issue #650', 'github.com/acme/client/issues/650', 45, null],
  ['[PAY-1102] Refund flow', 'jira.acme.com/browse/PAY-1102', 21, null],
  ['Q3 retro notes', 'acme.slite.com/app/docs/eF56', 0, null],
  ['Incident runbook', 'acme.slite.com/app/docs/cD34', 3, 'Read later'],
  ['Building a tab manager UI', 'web.dev/articles/tab-ui', 30, 'Read later'],
  ['Rust for JavaScript developers', 'blog.example.org/rust-for-js', 60, 'Read later'],
];

let wins, tabs, saved, topics, nextId, nextWin;
function reset() {
  nextId = 1;
  wins = DEF.map(([name], i) => ({ id: i + 1, name }));
  nextWin = wins.length + 1;
  tabs = DEF.flatMap(([, groups], i) => groups.flatMap(([g, rows]) => rows.map(([t, u, d]) => ({ id: nextId++, t, u, d, w: i + 1, g, sus: false }))));
  saved = SAVED_DEF.map(([t, u, d, topic]) => ({ id: nextId++, t, u, d, topic }));
  topics = ['Release 2.0', 'Read later'];
}

// ---------- shared helpers ----------
const urlCounts = () => tabs.reduce((m, t) => m.set(t.u, (m.get(t.u) || 0) + 1), new Map());
const isDup = (t, counts) => counts.get(t.u) > 1;
const isStale = t => t.d >= STALE_DAYS;
const winNumber = id => wins.findIndex(w => w.id === id) + 1;
const winOf = id => wins.find(w => w.id === id);
const groupNames = w => [...new Set(tabs.filter(t => t.w === w).map(t => t.g))];
const groupTabs = (w, g) => tabs.filter(t => t.w === w && t.g === g);
const shortUrl = u => u.replace(/^www\./, '');

function badges(t, counts) {
  return `${isDup(t, counts) ? '<span class="copy-pill">dup</span>' : ''}${isStale(t) ? '<span class="stale-tag">stale</span>' : ''}`;
}
function stats(w, counts) {
  const mine = tabs.filter(t => t.w === w);
  const dups = mine.filter(t => isDup(t, counts)).length;
  return `${mine.length} tabs · ${new Set(mine.map(t => hostOf(t.u))).size} site${new Set(mine.map(t => hostOf(t.u))).size === 1 ? "" : "s"}${dups ? ` · <span class="dup-count">${dups} dups</span>` : ''}`;
}
function prune() { wins = wins.filter(w => tabs.some(t => t.w === w.id)); }
function closeTabs(list, save) {
  const ids = new Set(list.map(t => t.id));
  if (save) for (const t of list) saved.push({ id: nextId++, t: t.t, u: t.u, d: 0, topic: null });
  tabs = tabs.filter(t => !ids.has(t.id));
  prune();
}
function moveToWindow(list, target) {
  let id = Number(target);
  if (target === 'new') {
    id = nextWin++;
    wins.push({ id, name: `New window ${id - DEF.length}` });
  }
  for (const t of list) t.w = id;
  prune();
}

function head(placeholder, pressed) {
  const seg = ['Groups', 'Windows', 'Library'].map(n => `<button type="button" aria-pressed="${n === pressed}">${n}</button>`).join('');
  const dups = [...urlCounts().values()].filter(n => n > 1).reduce((s, n) => s + n - 1, 0);
  return `<div class="head"><input class="search" type="search" placeholder="${placeholder}"><div class="seg">${seg}</div>
    <button type="button" class="btn danger">Close duplicates (${dups})</button><button type="button" class="icon-btn">${icon('settings')}</button></div>`;
}

// ---------- A: kanban by window ----------
const openGroups = new Set();
let openInit = false;
function tabRow(t, counts) {
  return `<li class="row ${t.sus ? 'suspended' : ''}" draggable="true" data-tab="${t.id}"><button type="button" class="row-main">${tile(hostOf(t.u))}<span class="t"><span class="title">${esc(t.t)}</span><span class="url">${esc(t.u)}</span></span></button>
    ${badges(t, counts)}<span class="actions"><button type="button" class="icon-btn" data-act="save" title="Save &amp; close">${icon('save')}</button><button type="button" class="icon-btn" data-act="close" data-close title="Close">${icon('close')}</button></span></li>`;
}
function groupCard(w, g, counts) {
  const list = groupTabs(w, g);
  const key = `${w}|${g}`;
  if (!openInit && w === wins[0]?.id) openGroups.add(key);
  const hosts = [...new Set(list.map(t => hostOf(t.u)))].slice(0, 3);
  return `<details class="group" data-k="${esc(key)}" data-w="${w}" data-g="${esc(g)}" ${openGroups.has(key) ? 'open' : ''}><summary draggable="true">
    <span class="chev">${icon('chevron')}</span><span class="mini-stack">${hosts.map(tile).join('')}</span>
    <span class="g-name">${esc(g)}</span><span class="g-meta">${list.length}</span><span class="g-spacer"></span>
    <button type="button" class="icon-btn" data-act="save" title="Save &amp; close group">${icon('save')}</button></summary>
    <ul class="rows">${list.map(t => tabRow(t, counts)).join('')}</ul></details>`;
}
function viewA() {
  const counts = urlCounts();
  const cols = wins.map(w => `<section class="col" data-drop="win:${w.id}" data-win="${w.id}">
    <header class="col-head"><span class="wl-icon">${winNumber(w.id)}</span><div class="win-title"><span class="g-name">${esc(w.name)}</span><span class="win-stats">${stats(w.id, counts)}</span></div>
      <button type="button" class="icon-btn" data-act="save" title="Save &amp; close window">${icon('save')}</button><button type="button" class="icon-btn" data-act="close" data-close title="Close window">${icon('close')}</button></header>
    <div class="col-body">${groupNames(w.id).map(g => groupCard(w.id, g, counts)).join('')}</div></section>`).join('');
  openInit = true;
  return `${head('Search tabs, URLs, groups…', 'Windows')}<div class="view"><div class="board">${cols}
    <section class="col col-new" data-drop="win:new">${icon('newWindow')}<span>+ New window</span><span class="hint-text">Drop a tab or group here</span></section></div></div>`;
}

// ---------- B: kanban by library topic ----------
function viewB() {
  const col = (name, label) => {
    const cards = saved.filter(s => s.topic === name);
    return `<section class="col" data-drop="topic:${esc(name ?? '')}"><header class="col-head"><div class="win-title"><span class="g-name">${esc(label)}</span><span class="win-stats">${cards.length} saved</span></div>
      <button type="button" class="icon-btn">${icon('more')}</button></header>
      <div class="col-body">${cards.map(s => `<article class="card" draggable="true" data-saved="${s.id}">${tile(hostOf(s.u))}<div class="t"><span class="title">${esc(s.t)}</span><span class="url">${esc(shortUrl(s.u))}</span><span class="age">saved ${ago(s.d)}</span></div>
        <button type="button" class="icon-btn" data-act="remove" data-close title="Remove from library">${icon('close')}</button></article>`).join('') || '<div class="col-empty">Drop saved tabs here</div>'}</div></section>`;
  };
  return `${head('Search saved tabs…', 'Library')}<div class="view"><div class="board">${col(null, 'No topic')}${topics.map(t => col(t, t)).join('')}
    <section class="col col-new" data-drop="topic:*new">${icon('plus')}<span>+ New topic</span><span class="hint-text">Drop a card to start a topic</span></section></div></div>`;
}

// ---------- C: tree ----------
const collapsed = new Set(['w4']);
const checked = new Set();
let cur = 'w1';
let status = '';
function treeRows() {
  const rows = [];
  for (const w of wins) {
    const wKey = `w${w.id}`;
    const wTabs = tabs.filter(t => t.w === w.id);
    rows.push({ key: wKey, type: 'w', lvl: 0, kids: wTabs.length, parent: null, ids: wTabs.map(t => t.id), win: w });
    if (collapsed.has(wKey)) continue;
    for (const g of groupNames(w.id)) {
      const gKey = `g${w.id}|${g}`;
      const list = groupTabs(w.id, g);
      rows.push({ key: gKey, type: 'g', lvl: 1, kids: list.length, parent: wKey, ids: list.map(t => t.id), name: g, list });
      if (collapsed.has(gKey)) continue;
      for (const t of list) rows.push({ key: `t${t.id}`, type: 't', lvl: 2, kids: 0, parent: gKey, ids: [t.id], tab: t });
    }
  }
  return rows;
}
function treeRow(r, counts) {
  const done = r.ids.filter(id => checked.has(id)).length;
  const box = `<input type="checkbox" data-ck ${done === r.ids.length ? 'checked' : ''} ${done > 0 && done < r.ids.length ? 'data-ind' : ''} aria-label="Select">`;
  const chev = r.kids ? `<span class="chev">${icon('chevron')}</span>` : '<span class="spacer"></span>';
  const cls = `tr ${r.type === 'w' ? 'win' : r.type === 'g' ? 'grp' : ''} ${collapsed.has(r.key) ? 'collapsed' : ''} ${r.key === cur ? 'sel' : ''} ${r.tab?.sus ? 'suspended' : ''}`;
  let body;
  if (r.type === 'w') {
    body = `<span class="wl-icon">${winNumber(r.win.id)}</span><span class="tt">${esc(r.win.name)}</span><span class="win-stats">${stats(r.win.id, counts)}</span>`;
  } else if (r.type === 'g') {
    body = `<span class="mini-stack">${[...new Set(r.list.map(t => hostOf(t.u)))].slice(0, 3).map(tile).join('')}</span><span class="tt">${esc(r.name)}</span><span class="g-meta">${r.kids}</span>`;
  } else {
    const t = r.tab;
    body = `${tile(hostOf(t.u))}<span class="tt">${esc(t.t)}</span><span class="url">${esc(t.u)}</span>${badges(t, counts)}<span class="age">used ${ago(t.d)}</span>`;
  }
  return `<div class="${cls}" role="treeitem" aria-level="${r.lvl + 1}" ${r.kids ? `aria-expanded="${!collapsed.has(r.key)}"` : ''} data-key="${esc(r.key)}" style="--lvl:${r.lvl}">${chev}${box}${body}</div>`;
}
function renderC() {
  document.getElementById('app').innerHTML = viewC();
  const tree = document.getElementById('tree');
  for (const box of tree.querySelectorAll('[data-ind]')) box.indeterminate = true;
  tree.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  tree.focus({ preventScroll: true });
}
function viewC() {
  const counts = urlCounts();
  const rows = treeRows();
  if (!rows.some(r => r.key === cur)) cur = rows[0].key;
  const bulk = checked.size ? `<div class="bulk" role="toolbar"><strong>${checked.size} selected</strong>
    <button type="button" class="btn" data-bulk="save">Save &amp; close</button>
    <select data-bulk-move aria-label="Move to window"><option value="">Move to window…</option>${wins.map(w => `<option value="${w.id}">${winNumber(w.id)} · ${esc(w.name)}</option>`).join('')}<option value="new">+ New window</option></select>
    <button type="button" class="btn" data-bulk="suspend">Suspend</button>
    <button type="button" class="btn danger" data-bulk="close">Close</button></div>` : '';
  return `${head('Search tabs, URLs, groups…', 'Groups')}<div class="view tree-view">
    <div class="tree-top"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>←</kbd> <kbd>→</kbd> collapse / expand</span><span><kbd>Space</kbd> check</span><span><kbd>Enter</kbd> open</span><span class="status">${esc(status)}</span></div>
    <div class="tree-scroll"><div id="tree" role="tree" tabindex="0">${rows.map(r => treeRow(r, counts)).join('')}</div>${bulk}</div></div>`;
}
function toggleCheck(r) {
  const all = r.ids.every(id => checked.has(id));
  for (const id of r.ids) all ? checked.delete(id) : checked.add(id);
}
function treeKey(e) {
  const rows = treeRows();
  const i = Math.max(0, rows.findIndex(r => r.key === cur));
  const r = rows[i];
  if (e.key === 'ArrowDown') cur = rows[Math.min(i + 1, rows.length - 1)].key;
  else if (e.key === 'ArrowUp') cur = rows[Math.max(i - 1, 0)].key;
  else if (e.key === 'ArrowRight') {
    if (!r.kids) return;
    if (collapsed.has(r.key)) collapsed.delete(r.key);
    else cur = rows[i + 1].key;
  } else if (e.key === 'ArrowLeft') {
    if (r.kids && !collapsed.has(r.key)) collapsed.add(r.key);
    else if (r.parent) cur = r.parent;
  } else if (e.key === ' ') toggleCheck(r);
  else if (e.key === 'Enter') {
    if (r.type === 't') status = `Opened “${r.tab.t}”`;
    else collapsed.has(r.key) ? collapsed.delete(r.key) : collapsed.add(r.key);
  } else return;
  e.preventDefault();
  renderC();
}
function bulk(action) {
  const list = tabs.filter(t => checked.has(t.id));
  if (action === 'save') closeTabs(list, true);
  if (action === 'close') closeTabs(list, false);
  if (action === 'suspend') for (const t of list) t.sus = true;
  status = `${list.length} tabs: ${action === 'save' ? 'saved & closed' : action === 'close' ? 'closed' : 'suspended'}`;
  checked.clear();
  renderC();
}

// ---------- D: split view ----------
let sel = { type: 'group', key: 'acme/client' };
function viewD() {
  const counts = urlCounts();
  const groups = [...new Set(tabs.map(t => t.g))];
  const item = (type, key, label, n, lead) => `<button type="button" class="item" data-sel data-type="${type}" data-key="${esc(key)}" aria-current="${sel.type === type && sel.key === String(key)}">${lead}<span class="nm">${esc(label)}</span><span class="n">${n}</span></button>`;
  const staleList = tabs.filter(isStale);
  const side = `<h3><span>Groups</span><span>${groups.length}</span></h3>${groups.map(g => item('group', g, g, tabs.filter(t => t.g === g).length, tile(hostOf(tabs.find(t => t.g === g).u)))).join('')}
    <h3><span>Windows</span><span>${wins.length}</span></h3>${wins.map(w => item('window', w.id, w.name, tabs.filter(t => t.w === w.id).length, `<span class="wl-icon">${winNumber(w.id)}</span>`)).join('')}
    <h3><span>Library topics</span><span>${saved.length}</span></h3>${[null, ...topics].map(t => item('topic', t ?? '', t ?? 'No topic', saved.filter(s => s.topic === t).length, `<span class="stale-icon" style="background:var(--accent-soft);color:var(--accent)">${icon('save')}</span>`)).join('')}
    <h3><span>Stale</span><span>${staleList.length}</span></h3>${item('stale', 'stale', `Not used for ${STALE_DAYS}+ days`, staleList.length, `<span class="stale-icon">${icon('clock')}</span>`)}`;

  let title = '';
  let list = [];
  let isSaved = false;
  if (sel.type === 'group') { title = sel.key; list = tabs.filter(t => t.g === sel.key); }
  if (sel.type === 'window') { title = winOf(Number(sel.key))?.name ?? ''; list = tabs.filter(t => t.w === Number(sel.key)); }
  if (sel.type === 'stale') { title = `Not used for ${STALE_DAYS}+ days`; list = staleList; }
  if (sel.type === 'topic') { title = sel.key || 'No topic'; list = saved.filter(s => s.topic === (sel.key || null)); isSaved = true; }

  const rowHtml = isSaved ? s => `<li class="row" data-saved="${s.id}"><button type="button" class="row-main">${tile(hostOf(s.u))}<span class="t"><span class="title">${esc(s.t)}</span><span class="url">${esc(s.u)}</span></span></button>
      ${s.topic ? `<span class="topic-pill">${esc(s.topic)}</span>` : ''}<span class="age">saved ${ago(s.d)}</span>
      <span class="actions"><button type="button" class="icon-btn" data-act="open" title="Open">${icon('open')}</button><button type="button" class="icon-btn" data-act="remove" data-close title="Remove from library">${icon('close')}</button></span></li>`
    : t => `<li class="row ${t.sus ? 'suspended' : ''}" data-tab="${t.id}"><button type="button" class="row-main">${tile(hostOf(t.u))}<span class="t"><span class="title">${esc(t.t)}</span><span class="url">${esc(t.u)}</span></span></button>
      ${badges(t, counts)}<button type="button" class="wl-icon" title="${esc(winOf(t.w).name)}">${winNumber(t.w)}</button><span class="age">used ${ago(t.d)}</span>
      <span class="actions"><button type="button" class="icon-btn" data-act="save" title="Save &amp; close">${icon('save')}</button><button type="button" class="icon-btn" data-act="suspend" title="Suspend">${icon('suspend')}</button><button type="button" class="icon-btn" data-act="move" title="Move to window">${icon('move')}</button><button type="button" class="icon-btn" data-act="close" data-close title="Close">${icon('close')}</button></span></li>`;
  const actions = isSaved ? `<button type="button" class="btn">Open all</button>`
    : `<button type="button" class="btn" data-act="save-all">Save &amp; close all</button><button type="button" class="btn danger" data-act="close-all">Close all</button>`;
  return `${head('Search tabs, URLs, groups…', 'Groups')}<div class="view split"><nav class="side" aria-label="Sections">${side}</nav>
    <section class="main"><div class="main-head"><h2>${esc(title)}</h2><span class="sub">${list.length} ${isSaved ? 'saved tabs' : 'tabs'}</span><span class="g-spacer"></span>${actions}</div>
    <ul class="rows main-list roomy">${list.map(rowHtml).join('') || '<li class="empty">Nothing here.</li>'}</ul></section></div>`;
}

// ---------- plumbing ----------
const VIEWS = { a: viewA, b: viewB, c: viewC, d: viewD };
const HINTS = {
  a: 'A: one column per window. Drag a tab row or a group header (grab it by the header) to another column to move it; drop on "+ New window" to open a new one.',
  b: 'B: columns are the topics of saved tabs. Drag a card to another column to change its topic; drop on "+ New topic" to start one.',
  c: 'C: window → group → tab outline. Click the list, then ↑/↓ move, ←/→ collapse and expand, Space checks, Enter opens. Checking anything shows the bulk bar.',
  d: 'D: sections on the left (Groups, Windows, Library topics, Stale), roomy rows on the right with window label and age.',
};
let view = 'a';
const app = document.getElementById('app');
function render() {
  document.getElementById('hint').textContent = HINTS[view];
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === view));
  if (view === 'c') return renderC();
  app.innerHTML = VIEWS[view]();
}

document.querySelector('.preview-bar').addEventListener('click', e => {
  const b = e.target.closest('[data-v]');
  if (b) { view = b.dataset.v; render(); }
});
document.getElementById('reset').addEventListener('click', () => { reset(); checked.clear(); openGroups.clear(); openInit = false; status = ''; sel = { type: 'group', key: 'acme/client' }; render(); });
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  root.style.colorScheme = root.style.colorScheme === 'dark' ? 'light' : 'dark';
});

// Group cards remember whether they are open across re-renders.
app.addEventListener('toggle', e => {
  const d = e.target.closest?.('details[data-k]');
  if (d) d.open ? openGroups.add(d.dataset.k) : openGroups.delete(d.dataset.k);
}, true);

// Which tabs does a button act on: its row, its group card, or its window column.
function targetTabs(el) {
  const row = el.closest('[data-tab]');
  if (row) return tabs.filter(t => t.id === Number(row.dataset.tab));
  const card = el.closest('details[data-g]');
  if (card) return groupTabs(Number(card.dataset.w), card.dataset.g);
  const col = el.closest('[data-win]');
  return col ? tabs.filter(t => t.w === Number(col.dataset.win)) : [];
}
app.addEventListener('click', e => {
  if (view === 'c') return clickC(e);
  const sec = e.target.closest('[data-sel]');
  if (sec) { sel = { type: sec.dataset.type, key: sec.dataset.key }; return render(); }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  e.preventDefault(); // a button inside <summary> must not toggle the group
  const act = btn.dataset.act;
  const savedRow = btn.closest('[data-saved]');
  if (act === 'remove') { saved = saved.filter(s => s.id !== Number(savedRow.dataset.saved)); return render(); }
  if (act === 'open') return;
  let list = targetTabs(btn);
  if (act === 'save-all' || act === 'close-all') list = view === 'd' ? [...app.querySelectorAll('[data-tab]')].map(r => tabs.find(t => t.id === Number(r.dataset.tab))) : [];
  if (act === 'save' || act === 'save-all') closeTabs(list, true);
  else if (act === 'close' || act === 'close-all') closeTabs(list, false);
  else if (act === 'suspend') for (const t of list) t.sus = !t.sus;
  else if (act === 'move') moveToWindow(list, wins.find(w => w.id !== list[0].w).id);
  render();
});

function clickC(e) {
  const rowEl = e.target.closest('[data-key]');
  if (e.target.closest('[data-bulk]')) return bulk(e.target.closest('[data-bulk]').dataset.bulk);
  if (!rowEl) return;
  const r = treeRows().find(x => x.key === rowEl.dataset.key);
  cur = r.key;
  if (e.target.matches('[data-ck]')) toggleCheck(r);
  else if (e.target.closest('.chev') && r.kids) collapsed.has(r.key) ? collapsed.delete(r.key) : collapsed.add(r.key);
  renderC();
}
app.addEventListener('change', e => {
  if (!e.target.matches('[data-bulk-move]') || !e.target.value) return;
  moveToWindow(tabs.filter(t => checked.has(t.id)), e.target.value);
  status = `${checked.size} tabs moved`;
  checked.clear();
  renderC();
});
app.addEventListener('keydown', e => { if (view === 'c' && e.target.id === 'tree') treeKey(e); });

// Native drag and drop for A and B. "drag" holds what is being moved.
let drag = null;
app.addEventListener('dragstart', e => {
  const row = e.target.closest?.('[data-tab]');
  const sum = e.target.closest?.('summary');
  const card = e.target.closest?.('[data-saved]');
  if (row) drag = { kind: 'tab', id: Number(row.dataset.tab), el: row };
  else if (sum) { const d = sum.parentElement; drag = { kind: 'group', w: Number(d.dataset.w), g: d.dataset.g, el: d }; }
  else if (card) drag = { kind: 'saved', id: Number(card.dataset.saved), el: card };
  else return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'oh-my-tabs');
  drag.el.classList.add('dragging');
});
app.addEventListener('dragover', e => {
  const zone = e.target.closest?.('[data-drop]');
  if (!drag || !zone) return;
  e.preventDefault();
  zone.classList.add('drop');
});
app.addEventListener('dragleave', e => {
  const zone = e.target.closest?.('[data-drop]');
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop');
});
app.addEventListener('dragend', () => { drag = null; render(); });
app.addEventListener('drop', e => {
  const zone = e.target.closest?.('[data-drop]');
  if (!drag || !zone) return;
  e.preventDefault();
  const [kind, value] = zone.dataset.drop.split(/:(.*)/s);
  if (kind === 'win') {
    const list = drag.kind === 'tab' ? tabs.filter(t => t.id === drag.id) : groupTabs(drag.w, drag.g);
    moveToWindow(list.filter(t => value === 'new' || t.w !== Number(value)), value);
  }
  if (kind === 'topic') {
    let topic = value || null;
    if (value === '*new') {
      topic = `New topic ${topics.length - 1}`;
      topics.push(topic);
    }
    saved.find(s => s.id === drag.id).topic = topic;
  }
  drag = null; // dragend re-renders
});

reset();
render();
</script>
</body>
</html>
