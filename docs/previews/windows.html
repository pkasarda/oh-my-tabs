<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Windows view options</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(oklch(97% 0.005 260), oklch(17% 0.01 260));
  --surface: light-dark(oklch(100% 0 0), oklch(21% 0.012 260));
  --surface-2: light-dark(oklch(96% 0.006 260), oklch(25% 0.014 260));
  --raised: light-dark(oklch(100% 0 0), oklch(30% 0.016 260));
  --border: light-dark(oklch(90% 0.008 260), oklch(34% 0.016 260));
  --text: light-dark(oklch(22% 0.02 260), oklch(93% 0.008 260));
  --muted: light-dark(oklch(52% 0.02 260), oklch(68% 0.015 260));
  --accent: light-dark(oklch(55% 0.19 265), oklch(72% 0.15 265));
  --accent-soft: light-dark(oklch(94% 0.04 265), oklch(32% 0.07 265));
  --danger: light-dark(oklch(55% 0.2 25), oklch(70% 0.17 25));
  --danger-soft: light-dark(oklch(95% 0.035 25), oklch(31% 0.07 25));
  --shadow: 0 8px 28px light-dark(oklch(30% 0.03 260 / 0.14), oklch(0% 0 0 / 0.5));
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
button { font: inherit; color: inherit; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar h1 { font-size: 14px; margin: 0 8px 0 0; }
.bar button { border: 1px solid var(--border); background: var(--surface-2); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
.bar button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.bar p { flex-basis: 100%; margin: 2px 0 0; color: var(--muted); }
.stage { width: 780px; max-width: 100%; margin: 20px auto; display: grid; gap: 8px; padding: 0 16px; }

.fav { flex: none; display: inline-grid; place-items: center; width: var(--s, 24px); height: var(--s, 24px); border-radius: 6px; background: var(--c); color: white; font: 700 calc(var(--s, 24px) * 0.42)/1 system-ui, sans-serif; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.dups { color: var(--danger); }
.muted { color: var(--muted); }

/* ---- the Groups view language, shared by E and F ---- */
details.card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
details.card[open] { background: var(--surface-2); }
details.card > summary { list-style: none; display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; border-radius: 10px; }
details.card > summary::-webkit-details-marker { display: none; }
.chev { flex: none; display: grid; color: var(--muted); transition: rotate 150ms var(--ease-out); }
.chev .i { width: 16px; height: 16px; }
details[open] > summary > .chev { rotate: 90deg; }
.mini { --s: 28px; display: flex; flex: none; }
.mini .fav { box-shadow: 0 0 0 2px var(--surface); }
details[open] > summary .mini .fav { box-shadow: 0 0 0 2px var(--surface-2); }
.mini .fav + .fav { margin-left: -9px; }
.title-line { min-width: 0; display: grid; }
.g-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { margin-left: auto; }
.wlabel { color: var(--muted); font-size: 12px; white-space: nowrap; }
.win.cur { border-color: var(--accent); }

.inner { display: grid; gap: 6px; padding: 0 10px 10px 34px; }
.inner details.card { background: var(--surface); }
.inner details.card[open] { background: var(--raised); }
.inner .mini { --s: 24px; }
ul.rows { list-style: none; margin: 0; padding: 0 6px 6px; }
.row { --s: 24px; display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.row:hover { background: var(--raised); }
.row .t { min-width: 0; flex: 1; display: grid; }
.row .title, .row .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .url { color: var(--muted); font-size: 11.5px; }
.singles-head { display: flex; gap: 8px; align-items: center; padding: 6px 4px 0; color: var(--muted); font-size: 11.5px; }
.singles-head::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.singles { list-style: none; margin: 0; padding: 0; }

/* ---- F: stacks that open a tab list below them ---- */
.fwin { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); padding: 10px; }
.fhead { display: flex; gap: 10px; align-items: center; }
.stacks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.stk { display: grid; gap: 5px; justify-items: start; min-width: 92px; max-width: 150px; padding: 8px; border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer; text-align: left; }
.stk:hover { background: var(--raised); }
.stk[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.stk .icons { --s: 28px; display: flex; }
.stk .icons .fav { box-shadow: 0 0 0 2px var(--surface-2); }
.stk .icons .fav + .fav { margin-left: -12px; }
.stk .cap { font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stk .cap .muted { margin-left: 4px; }
.fpanel { margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  .fpanel { animation: open 180ms var(--ease-out); }
  @keyframes open { from { opacity: 0; translate: 0 -4px; } }
}
.fpanel .phead { display: flex; gap: 8px; align-items: center; padding: 8px 12px 2px; font-weight: 600; }

/* ---- B and D, kept for comparison ---- */
.bwin { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); padding: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { --s: 20px; display: inline-flex; gap: 7px; align-items: center; max-width: 230px; padding: 4px 10px 4px 5px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
.chip span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="bar">
  <h1>Windows view · options</h1>
  <button type="button" data-v="e" aria-pressed="true">E · Windows as groups</button>
  <button type="button" data-v="f" aria-pressed="false">F · Stacks that open</button>
  <button type="button" data-v="b" aria-pressed="false">B · Chips (earlier)</button>
  <p id="hint"></p>
</div>
<div class="stage" id="stage"></div>

<script type="module">
const G = (name, count, letter, hue, dups = 0) => ({ name, count, letter, hue, dups });
const WINDOWS = [
  { id: 1, name: 'github.com & 11 more', cur: true, stats: '28 tabs · 12 sites · <span class="dups">2 dups</span> · active 5 h ago', groups: [
    G('github.com', 11, 'GH', 260, 2), G('acme.slite.com', 3, 'S', 30), G('docs.example.com', 3, 'T', 255), G('status.example.com', 2, 'DX', 0),
    G('jira.acme.com', 2, 'J', 250), G('caniuse.com', 1, 'A', 280), G('developer.mozilla.org', 1, 'M', 140), G('nodejs.org', 1, 'L', 350),
    G('web.dev', 1, 'F', 270), G('npmjs.com', 1, 'P', 200), G('translate.example.com', 1, 'T', 220), G('example.org', 1, 'RV', 20),
  ] },
  { id: 2, name: 'preview-4f2a.pages.example.dev & 4 more', stats: '5 tabs · 5 sites · active 5 h ago', groups: [
    G('preview-4f2a.pages.example.dev', 1, '</>', 25), G('github.com', 1, 'GH', 260), G('example.net', 1, 'N', 240), G('vitejs.dev', 1, 'Nx', 0), G('typescriptlang.org', 1, 'TS', 60),
  ] },
  { id: 19, name: 'acme.slite.com & 6 more', stats: '59 tabs · 7 sites · <span class="dups">6 dups</span> · active 2 h ago', groups: [
    G('acme.slite.com', 49, 'S', 30, 5), G('acme/client', 3, 'GH', 260, 1), G('Jira · PAY', 3, 'J', 250), G('acme/sdk', 1, 'GH', 260),
    G('drive.google.com', 1, 'D', 145), G('blog.example.org', 1, 'G', 10), G('notes.example.org', 1, 'B', 90),
  ] },
];

const HINTS = {
  e: 'A window looks exactly like a group in the Groups view. Open it: its groups appear in the same style and open further into tabs; 1-tab sites are plain tab rows under "1-tab sites". One visual language, three levels.',
  f: 'The stacks stay as an overview. Click a stack (or Enter): its tabs open as rows right below the stacks, in the Groups view row style. Click again or another stack to switch. 1-tab sites merge into one stack.',
  b: 'The chips from before, for comparison.',
};

const ICON = {
  chevron: '<path d="m9 18 6-6-6-6"/>', plus: '<path d="M5 12h14"/><path d="M12 5v14"/>', minimize: '<path d="M5 12h14"/>',
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
const icon = name => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fav = (g, size) => `<span class="fav" style="--c:oklch(55% 0.13 ${g.hue});${size ? `--s:${size}px` : ''}" aria-hidden="true">${esc(g.letter)}</span>`;
const pages = g => Array.from({ length: g.count }, (_, i) => ({ title: `${g.name} — ${['Pull request', 'Docs', 'Issue', 'Dashboard', 'Settings'][i % 5]} ${i + 1}`, url: `${g.name}/page/${i + 1}` }));
const row = (g, p) => `<li class="row">${fav(g)}<span class="t"><span class="title">${esc(p.title)}</span><span class="url">${esc(p.url)}</span></span></li>`;
const multi = w => w.groups.filter(g => g.count > 1);
const singles = w => w.groups.filter(g => g.count === 1);
const actions = `<span class="spacer"></span>${['plus', 'minimize', 'close'].map(n => `<button type="button" class="icon-btn" title="${n}">${icon(n)}</button>`).join('')}`;

function viewE() {
  return WINDOWS.map(w => `<details class="card win${w.cur ? ' cur' : ''}" ${w.cur ? 'open' : ''}>
    <summary>
      <span class="chev">${icon('chevron')}</span>
      <span class="mini">${w.groups.slice(0, 4).map(g => fav(g)).join('')}</span>
      <span class="title-line"><span class="g-name">${esc(w.name)}</span><span class="sub">${w.stats}</span></span>
      ${actions}<span class="wlabel">${w.cur ? 'This window' : `Window ${w.id}`}</span>
    </summary>
    <div class="inner">
      ${multi(w).map(g => `<details class="card">
        <summary><span class="chev">${icon('chevron')}</span><span class="mini">${Array.from({ length: Math.min(g.count, 4) }, () => fav(g)).join('')}</span>
          <span class="g-name">${esc(g.name)}</span><span class="muted">${g.count}</span>${g.dups ? `<span class="dups">${g.dups} dup${g.dups > 1 ? 's' : ''}</span>` : ''}</summary>
        <ul class="rows">${pages(g).map(p => row(g, p)).join('')}</ul>
      </details>`).join('')}
      ${singles(w).length ? `<div class="singles-head">1-tab sites · ${singles(w).length}</div>
        <ul class="singles">${singles(w).map(g => row(g, { title: `${g.name} — Home`, url: g.name })).join('')}</ul>` : ''}
    </div>
  </details>`).join('');
}

const openStack = new Map([[1, 'github.com']]);

function viewF() {
  return WINDOWS.map(w => {
    const stacks = [...multi(w).map(g => ({ key: g.name, label: g.name, count: g.count, favs: Array.from({ length: Math.min(g.count, 4) }, () => g), dups: g.dups, tabs: pages(g).map(p => [g, p]) }))];
    if (singles(w).length) stacks.push({ key: '1-tab', label: '1-tab sites', count: singles(w).length, favs: singles(w).slice(0, 5), dups: 0, tabs: singles(w).map(g => [g, { title: `${g.name} — Home`, url: g.name }]) });
    const open = stacks.find(s => s.key === openStack.get(w.id));
    return `<section class="fwin${w.cur ? ' win cur' : ''}">
      <div class="fhead"><span class="title-line"><span class="g-name">${esc(w.name)}</span><span class="sub">${w.stats}</span></span>${actions}<span class="wlabel">${w.cur ? 'This window' : `Window ${w.id}`}</span></div>
      <div class="stacks">${stacks.map(s => `<button type="button" class="stk" data-w="${w.id}" data-k="${esc(s.key)}" aria-expanded="${s === open}">
        <span class="icons">${s.favs.map(g => fav(g)).join('')}</span>
        <span class="cap">${esc(s.label)}<span class="muted">${s.count}</span>${s.dups ? ` <span class="dups">· ${s.dups}</span>` : ''}</span></button>`).join('')}</div>
      ${open ? `<div class="fpanel"><div class="phead">${esc(open.label)} <span class="muted">${open.count}</span></div><ul class="rows">${open.tabs.map(([g, p]) => row(g, p)).join('')}</ul></div>` : ''}
    </section>`;
  }).join('');
}

function viewB() {
  return WINDOWS.map(w => `<section class="bwin${w.cur ? ' win cur' : ''}"><div class="fhead"><span class="title-line"><span class="g-name">${esc(w.name)}</span><span class="sub">${w.stats}</span></span>${actions}</div>
    <div class="chips">${w.groups.map(g => `<span class="chip">${fav(g)}<span>${esc(g.name)}</span><span class="muted">${g.count}</span></span>`).join('')}</div></section>`).join('');
}

const VIEWS = { e: viewE, f: viewF, b: viewB };
let view = 'e';
function render() {
  document.getElementById('hint').textContent = HINTS[view];
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === view));
  document.getElementById('stage').innerHTML = VIEWS[view]();
}
document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('[data-v]');
  if (!b) return;
  view = b.dataset.v;
  render();
});
document.getElementById('stage').addEventListener('click', e => {
  const stk = e.target.closest('.stk');
  if (!stk) return;
  const w = Number(stk.dataset.w);
  openStack.set(w, openStack.get(w) === stk.dataset.k ? null : stk.dataset.k);
  render();
});
render();
</script>
</body>
</html>
