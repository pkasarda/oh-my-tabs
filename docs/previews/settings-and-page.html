<!doctype html>
<html lang="en" class="mono">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings and page preview</title>
<link rel="icon" href="data:,">
<!-- The extension's own stylesheet, so the preview looks like the product. Only what is new is below. -->
<link rel="stylesheet" href="../../popup.css">
<style>
  :root {
    --fs: 13px;
    /* The browser's nine tab group colors, as our own light and dark values. */
    --tg-grey: light-dark(#6b7280, #9ca3af); --tg-blue: light-dark(#2563eb, #60a5fa); --tg-red: light-dark(#dc2626, #f87171);
    --tg-yellow: light-dark(#ca8a04, #facc15); --tg-green: light-dark(#16a34a, #4ade80); --tg-pink: light-dark(#db2777, #f472b6);
    --tg-purple: light-dark(#7c3aed, #a78bfa); --tg-cyan: light-dark(#0891b2, #22d3ee); --tg-orange: light-dark(#ea580c, #fb923c);
    --amber: light-dark(#b45309, #fbbf24); --amber-soft: light-dark(#fef3c7, #3b2a0b);
  }
  :root:root body { font-size: var(--fs); }
  :where(button, a, select, input, textarea, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr; background: var(--bg); overflow: hidden; }
  .preview-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font: 13px var(--sans); }
  .preview-bar strong { margin-right: 8px; }
  .preview-bar button { border: 1px solid var(--border); background: var(--surface-2); padding: 5px 10px; border-radius: 8px; }
  .preview-bar button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .preview-bar p { flex-basis: 100%; margin: 2px 0 0; color: var(--muted); }
  .preview-bar label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .ctx { display: contents; }
  .tb { position: relative; display: inline-grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); font: 700 10px var(--mono); }
  .tb b { position: absolute; right: -6px; bottom: -6px; min-width: 16px; padding: 0 4px; border-radius: 8px; background: #f59e0b; color: #1c1917; font: 700 10px/16px var(--sans); text-align: center; }
  .stage { min-height: 0; min-width: 0; display: grid; padding: 12px 16px 16px; overflow: auto; }
  .popup-frame { width: 800px; height: 600px; margin: auto; padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); box-shadow: var(--shadow); }
  .popup-frame .app { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .popup-frame .body { padding-top: 8px; }

  /* Header: icon button with the duplicate count on it. */
  .dup { position: relative; color: var(--danger); }
  .dup:disabled { opacity: 0.4; cursor: default; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: light-dark(#fff, oklch(20% 0.03 25)); font: 700 10px/16px var(--sans); text-align: center; }
  .head .btn { display: inline-flex; gap: 6px; align-items: center; }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .tgchip { flex: none; display: inline-flex; gap: 5px; align-items: center; max-width: 150px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stale-tag { flex: none; border-radius: 9px; padding: 1px 7px; font-size: 11px; font-weight: 600; background: var(--amber-soft); color: var(--amber); }
  .rem-tag { flex: none; display: inline-flex; gap: 4px; align-items: center; border-radius: 9px; padding: 1px 7px; font-size: 11px; font-weight: 600; background: var(--amber-soft); color: var(--amber); white-space: nowrap; }
  .rem-tag .i { width: 12px; height: 12px; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }

  /* The page: header, sidebar, list, optional details pane and status bar. */
  .pg { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .pg-body { display: grid; min-height: 0; }
  .pg .side { min-width: 0; }
  .pg .side .sub { padding-left: 36px; }
  .pg .side .stale-icon { width: 20px; height: 20px; border-radius: 5px; }
  .pg .side .stale-icon .i { width: 13px; height: 13px; }
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .main-head { display: flex; gap: 10px; align-items: center; padding: 12px 18px; }
  .main-head h2 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main-head .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .main .results-bar { border-top: 1px solid var(--border); }
  .tree-top { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 18px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; min-height: 40px; }
  .tree-top.tools { padding: 4px 12px; gap: 4px; }
  .tree-top select, .srow select { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); cursor: pointer; }
  .tree-scroll { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
  #tree { outline: none; }
  #tree:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .tr { --lvl: 0; --fav: 20px; position: relative; display: flex; gap: 8px; align-items: center; min-height: calc(var(--fs) * 2.6); padding: 2px 12px 2px calc(12px + var(--lvl) * 24px); cursor: pointer; background-image: repeating-linear-gradient(to right, transparent 0 22px, var(--border) 22px 23px, transparent 23px 24px); background-size: calc(var(--lvl) * 24px + 12px) 100%; background-repeat: no-repeat; }
  .tr:hover { background-color: var(--surface-2); }
  .tr.sel { background-color: var(--raised); box-shadow: inset 0 0 0 1px var(--accent); }
  .tr.w { background-color: var(--surface-2); border-top: 1px solid var(--border); font-weight: 600; }
  .tr.g, .tr.tg, .tr.rg { font-weight: 600; }
  .tr.tg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
  .tr.rg { color: var(--amber); }
  .tr .chev, .tr .spacer { width: 16px; flex: none; }
  .tr:not(.collapsed) > .chev { rotate: 90deg; }
  .tr .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .tt.grow { flex: 1; }
  .tr .url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11.5px; }
  .tr.suspended .tt { color: var(--muted); }
  .tr.suspended .fav { opacity: 0.45; }
  .tr input[type="checkbox"] { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .tr .age { min-width: 70px; text-align: right; }
  .tr .icon-btn { width: 28px; height: 28px; }
  .bulk-bar { position: sticky; bottom: 12px; width: max-content; margin: 12px auto 0; }
  .details { min-width: 0; overflow: auto; padding: 18px; border-left: 1px solid var(--border); }
  .details h3 { margin: 12px 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  .details .full { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .details .fav { --fav: 56px; border-radius: 12px; }
  .details dl { display: grid; grid-template-columns: auto 1fr; margin: 16px 0; border-top: 1px solid var(--border); }
  .details dt, .details dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .details dt { color: var(--muted); padding-right: 12px; }
  .details dd { display: flex; gap: 6px; align-items: center; justify-content: flex-end; text-align: right; }
  .details .btns { display: grid; gap: 6px; }
  .details .head-row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .empty-d { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; }
  .statusbar { display: flex; gap: 8px; padding: 6px 16px; border-top: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-size: 12px; }

  /* Menu, palette, toast. */
  .menu hr + button.sub-back { color: var(--muted); }
  .palette { width: min(560px, calc(100vw - 32px)); margin: 14vh auto auto; padding: 0; max-width: none; overflow: hidden; }
  .pal-in { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
  .pal-in input { flex: 1; border: 0; background: none; outline: none; font-size: 15px; color: var(--text); }
  .pal-list { max-height: 360px; overflow: auto; padding: 6px; }
  .pal-list h4 { margin: 8px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .pal-item { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 7px; cursor: pointer; min-width: 0; }
  .pal-item[aria-selected="true"] { background: var(--accent-soft); }
  .pal-item .url { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal-item .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast { left: 50%; bottom: 28px; top: auto; translate: -50% 0; min-width: 0; }
  .toast:popover-open { translate: -50% 0; }

  /* Settings window: macOS System Settings style. */
  dialog.settings-win { width: 680px; height: 460px; max-width: none; padding: 0; overflow: hidden; border-radius: 12px; }
  dialog.settings-win[open] { display: grid; grid-template-columns: 180px minmax(0, 1fr); }
  dialog::backdrop { background: oklch(0% 0 0 / 0.4); }
  .sp-nav { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; background: var(--surface-2); border-right: 1px solid var(--border); }
  .sp-nav button { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
  .sp-nav button[aria-selected="true"] { background: var(--accent); color: light-dark(#fff, oklch(18% 0.02 265)); }
  .tile { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--tc); color: #fff; }
  .tile .i { width: 14px; height: 14px; }
  .sp-main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
  .sp-title { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px 22px; }
  .sp-title h2 { margin: 0; font-size: 18px; }
  .sp-body { overflow: auto; padding: 8px 22px 22px; display: grid; gap: 16px; align-content: start; }
  .card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .srow { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 10px 14px; }
  .srow + .srow, .srow + .field { border-top: 1px solid var(--border); }
  .lbl { display: grid; gap: 2px; min-width: 0; }
  .lbl > span:first-child { white-space: nowrap; }
  .desc { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  .srow .switch { flex: none; margin: 0; cursor: pointer; }
  .srow .seg { flex: none; }
  .srow input[type="text"], .never { padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); font: inherit; outline: none; }
  .srow input[type="text"]:focus-visible, .never:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .never { display: block; width: 100%; height: 190px; resize: none; font: 12px/1.5 var(--mono); }
  .err { display: block; margin-top: 4px; color: var(--danger); font-size: 11.5px; }
  .pill14 { margin-left: 6px; padding: 0 6px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 10px; font-weight: 700; vertical-align: 1px; }
  .srow.link { color: var(--text); text-decoration: none; }
  .srow.link:hover { background: var(--surface-2); }
  .srow.link .i { color: var(--muted); }
  .kbds { display: flex; gap: 4px; }
  .center { text-align: center; padding: 18px; display: grid; gap: 4px; }
  @media (max-width: 1100px) { .tr .url { display: none; } }
</style>
</head>
<body>
<div class="preview-bar">
  <strong>Settings and page preview</strong>
  <button type="button" data-scene="1">1 · Popup · Settings</button>
  <button type="button" data-scene="2">2 · Page · Tab groups</button>
  <button type="button" data-scene="3">3 · Page · Ideas</button>
  <button type="button" data-scene="4">4 · Page · Reminders (1.4)</button>
  <button type="button" id="reset">Reset data</button>
  <button type="button" id="theme">Light / dark</button>
  <span class="ctx" id="ctx"></span>
  <p id="hint"></p>
</div>
<div class="stage" id="stage"></div>
<dialog class="settings-win" id="settings" aria-label="Settings"></dialog>
<dialog class="palette" id="palette" aria-label="Command palette">
  <div class="pal-in"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="pal-q" type="text" placeholder="Type an action or a tab…" autocomplete="off" aria-label="Command palette"></div>
  <div class="pal-list" id="pal-list" role="listbox"></div>
</dialog>
<div popover id="menu" class="menu" role="menu" aria-label="Actions"></div>
<div popover="manual" id="toast" class="toast" role="status"></div>

<script type="module">

const unique = a => [...new Set(a)];
const $ = s => document.querySelector(s);
function tile(host) {
  let hue = 0;
  for (const ch of host) hue = (hue * 31 + ch.charCodeAt(0)) % 360;

const S = { scene: 1, pview: 'groups', sec: 'general', sel: 'groups', cur: null, last: null, hintGone: false, sbHidden: false, dHidden: false };

function reset() {

// ---------- derived ----------
const tgOn = () => S.prefs.tabGroups;
const tgById = id => S.tgs.find(g => g.id === id);

const tgOf = t => (tgOn() && t.tg ? tgById(t.tg) : null);
const urlCounts = () => S.tabs.reduce((m, t) => m.set(t.u, (m.get(t.u) || 0) + 1), new Map());
const dupTotal = () => [...urlCounts().values()].reduce((s, n) => s + (n > 1 ? n - 1 : 0), 0);
const isStale = t => S.prefs.stale && t.d >= S.prefs.days && !(S.scene === 4 && S.rem[t.id]);
const dueIds = () => S.tabs.filter(t => S.rem[t.id]?.due).map(t => t.id);
const schedIds = () => S.tabs.filter(t => S.rem[t.id]?.at).map(t => t.id);
const winName = id => S.wins.find(w => w.id === id)?.name ?? '';
const tabOf = key => S.tabs.find(t => `t${t.id}` === key);
const sorted = list => (S.prefs.sort === 'recent' ? [...list].sort((a, b) => a.d - b.d) : list);
const tgChip = t => { const g = tgOf(t); return g ? `<span class="tgchip" style="--c:var(--tg-${g.color})"><i class="dot"></i>${esc(tgName(g))}</span>` : ''; };
function badges(t) {
  const dup = urlCounts().get(t.u) > 1 ? '<span class="copy-pill">dup</span>' : '';

  const r = S.scene === 4 && S.rem[t.id]?.at ? `<span class="rem-tag">${icon('bell')}${esc(S.rem[t.id].at)}</span>` : '';
  return dup + stale + r;
}

// ---------- header, shared by popup and page ----------

// ---------- scene 1: popup ----------
function popupRow(t) {

// ---------- scenes 2-4: the page ----------
// A row is {key, type, lvl, parent, ids, kids, ...}. Collapsed parents hide their children, unless "all" asks for every key.
function addGroup(out, o, list, all, extra = {}) {
  out.push({ type: 'g', parent: null, ...o, ids: list.map(t => t.id), kids: list.length, ...extra });
  if (all || !S.collapsed.has(o.key)) for (const t of sorted(list)) out.push({ key: `t${t.id}`, type: 't', lvl: o.lvl + 1, parent: o.key, ids: [t.id], kids: 0, tab: t });
}
function addWindow(out, w, all) {
  const wt = S.tabs.filter(t => t.w === w.id);
  const key = `w${w.id}`;
  out.push({ key, type: 'w', lvl: 0, parent: null, ids: wt.map(t => t.id), kids: wt.length, win: w });
  if (!all && S.collapsed.has(key)) return;
  let rest = wt;
  if (tgOn()) {
    for (const g of S.tgs.filter(g => g.w === w.id && wt.some(t => t.tg === g.id))) addGroup(out, { key: `tg${g.id}`, type: 'tg', lvl: 1, parent: key }, wt.filter(t => t.tg === g.id), all, { tg: g, name: tgName(g) });
    rest = wt.filter(t => !t.tg);
  }
  for (const name of unique(rest.map(t => t.g))) addGroup(out, { key: `g${w.id}|${name}`, lvl: 1, parent: key }, rest.filter(t => t.g === name), all, { name });
}
function buildRows(all = false) {

  const sel = S.sel;

  else if (/^w\d+$/.test(sel)) addWindow(out, S.wins.find(w => `w${w.id}` === sel), all);
  else if (/^tg\d+$/.test(sel)) { const g = tgById(Number(sel.slice(2))); addGroup(out, { key: sel, type: 'tg', lvl: 0 }, S.tabs.filter(t => t.tg === g.id), all, { tg: g, name: tgName(g) }); }
  else if (sel === 'stale') addGroup(out, { key: 'gstale', lvl: 0 }, S.tabs.filter(isStale), all, { name: `Not used for ${S.prefs.days}+ days` });
  else if (sel === 'sched') for (const id of schedIds()) out.push({ key: `t${id}`, type: 't', lvl: 0, parent: null, ids: [id], kids: 0, tab: S.tabs.find(t => t.id === id) });
  else if (sel.startsWith('topic:')) for (const s of S.saved.filter(s => (s.topic ?? '') === sel.slice(6))) out.push({ key: `s${s.id}`, type: 's', lvl: 0, ids: [], kids: 0, saved: s });
  else {
    const due = dueIds();
    const showRem = S.scene === 4 || sel === 'due';
    if (showRem && due.length) {
      out.push({ key: 'rg', type: 'rg', lvl: 0, parent: null, ids: due, kids: due.length });
      if (all || !S.collapsed.has('rg')) for (const id of due) out.push({ key: `t${id}`, type: 'due', lvl: 1, parent: 'rg', ids: [id], kids: 0, tab: S.tabs.find(t => t.id === id) });
    }
    if (sel !== 'due') {
      const rest = S.tabs.filter(t => !(S.scene === 4 && S.rem[t.id]?.due));
      for (const name of unique(rest.map(t => t.g))) addGroup(out, { key: `g|${name}`, lvl: 0 }, rest.filter(t => t.g === name), all, { name });
    }

}
function titleOf() {

}
function rowHtml(r) {

  const list = S.tabs.filter(t => ids.includes(t.id));

  } else {
    const all = r.ids.every(id => S.checked.has(id));
    r.ids.forEach(id => (all ? S.checked.delete(id) : S.checked.add(id)));
  }
  S.last = r.key;
}
const checkedIds = () => [...S.checked];
const DO = {
  dups: closeDups,
  settings: openSettings,
  palette: openPalette,
  hintOn() { S.prefs.tabGroups = true; render(); },
  hintX() { S.hintGone = true; render(); },
  toggleSide() { S.sbHidden = !S.sbHidden; render(); },
  toggleDetails() { S.dHidden = !S.dHidden; render(); },
  collapse() { buildRows(true).filter(r => r.kids).forEach(r => S.collapsed.add(r.key)); render(); },
  expand() { S.collapsed.clear(); render(); },
  reveal() {
    const t = S.tabs.find(t => t.u === ACTIVE_URL);
    S.sel = 'all'; S.cur = `t${t.id}`;
    for (const k of [`w${t.w}`, `tg${t.tg}`, `g${t.w}|${t.g}`]) S.collapsed.delete(k);
    render();
    $('.tr.sel')?.scrollIntoView({ block: 'center' });
  },
  saveAll() { act('save', buildRows().filter(r => r.type === 't' || r.type === 'due').flatMap(r => r.ids)); },
  closeAll() { act('close', buildRows().filter(r => r.type === 't' || r.type === 'due').flatMap(r => r.ids)); },
  'b-save': () => act('save', checkedIds()), 'b-close': () => act('close', checkedIds()), 'b-suspend': () => act('suspend', checkedIds()),
  'b-move': () => { toast(`Would move ${S.checked.size} tabs to a new window`); S.checked.clear(); render(); }, 'b-clear'() { S.checked.clear(); render(); },
  'd-switch': () => toast(`Would switch to “${tabOf(S.cur).t}”`), 'd-save': () => act('save', [tabOf(S.cur).id]), 'd-close': () => act('close', [tabOf(S.cur).id]),
};
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('dialog, #menu, #toast')) return;
  const sc = t.closest('[data-scene]');
  if (sc) return setScene(Number(sc.dataset.scene));
  if (t.closest('#tgToggle')) { S.prefs.tabGroups = !S.prefs.tabGroups; return render(); }
  const pv = t.closest('[data-pview]');
  if (pv) { S.pview = pv.dataset.pview; return render(); }
  const side = t.closest('[data-sel]');
  if (side) { S.sel = side.dataset.sel; S.checked.clear(); return render(); }
  const tr = t.closest('.tr');
  const btn = t.closest('[data-do]');
  if (btn && DO[btn.dataset.do]) return DO[btn.dataset.do]();
  if (!tr) return;
  const r = rowOf(tr);
  if (!r) return;
  if (t.closest('[data-close]')) return r.saved ? (S.saved = S.saved.filter(s => s !== r.saved), render()) : act('close', r.ids);
  if (t.closest('[data-more]')) { const b = t.closest('[data-more]').getBoundingClientRect(); return openMenu(r, b.right - 200, b.bottom + 4); }
  if (btn) {
    const a = btn.dataset.do;
    if (a === 'again') { const b = btn.getBoundingClientRect(); return openMenu(r, b.left, b.bottom + 4, 'remind'); }
    return a === 'done' ? act('done', r.ids) : toast(`Would open “${r.tab.t}”`);
  }
  S.cur = r.key;
  if (t.matches('[data-ck]')) toggleCheck(r, e);
  else if (r.kids) S.collapsed.has(r.key) ? S.collapsed.delete(r.key) : S.collapsed.add(r.key);
  render();
});
document.addEventListener('change', e => {
  const idea = e.target.dataset.idea;
  if (idea) { S.ideas[idea] = e.target.checked; render(); }
  if (e.target.matches('[data-sort]')) { S.prefs.sort = e.target.value; render(); }
});
document.addEventListener('contextmenu', e => {
  const tr = e.target.closest('.tr');
  if (!tr || S.scene !== 3 || !S.ideas.menu) return;
  const r = rowOf(tr);
  if (!r || r.type === 'rg' || r.type === 's') return;
  e.preventDefault();
  openMenu(r, e.clientX, e.clientY);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && S.scene === 3 && S.ideas.palette) { e.preventDefault(); return openPalette(); }
  if (e.target.id !== 'tree') return;
  const rows = buildRows();
  const i = Math.max(0, rows.findIndex(r => r.key === S.cur));
  const r = rows[i];
  if (e.key === 'ArrowDown') S.cur = rows[Math.min(i + 1, rows.length - 1)].key;
  else if (e.key === 'ArrowUp') S.cur = rows[Math.max(i - 1, 0)].key;
  else if (e.key === 'ArrowRight' && r.kids) { if (S.collapsed.has(r.key)) S.collapsed.delete(r.key); else S.cur = rows[i + 1].key; }
  else if (e.key === 'ArrowLeft') { if (r.kids && !S.collapsed.has(r.key)) S.collapsed.add(r.key); else if (r.parent) S.cur = r.parent; }
  else if (e.key === ' ' && r.ids.length) toggleCheck(r, e);
  else if (e.key === 'Enter') r.tab ? toast(`Would open “${r.tab.t}”`) : r.kids && (S.collapsed.has(r.key) ? S.collapsed.delete(r.key) : S.collapsed.add(r.key));
  else return;
  e.preventDefault();
  render();
  $('#tree')?.focus({ preventScroll: true });
  $('.tr.sel')?.scrollIntoView({ block: 'nearest' });
});
$('#reset').addEventListener('click', () => { reset(); applyPrefs(); render(); });
$('#theme').addEventListener('click', () => { S.prefs.theme = S.prefs.theme === 'dark' ? 'light' : 'dark'; applyPrefs(); if (dlg.open) renderSettings(); });

reset();
applyPrefs();
setScene(1);
</script>
</body>
</html>
