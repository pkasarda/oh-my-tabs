<!doctype html>
<html lang="en" class="page">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>oh-my-tabs</title>
<script src="appearance.js"></script>
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<main class="app" id="app">
  <div class="head">
    <button type="button" class="icon-btn" id="toggle-side" aria-controls="side" aria-pressed="true" aria-label="Sidebar" data-tip="Show or hide the sidebar" data-icon="panelLeft"></button>
    <input class="search" id="search" type="search" placeholder="Search tabs, URLs, groups…" autocomplete="off" aria-label="Search tabs" autofocus>
    <button type="button" class="btn" id="open-palette" aria-haspopup="dialog" aria-label="Commands"><span class="label">Commands</span><kbd id="palette-key"></kbd></button>
    <button type="button" class="icon-btn" id="close-dups" aria-label="Close duplicates" data-tip="Close duplicates"></button>
    <button type="button" class="icon-btn" id="toggle-details" aria-controls="details" aria-pressed="false" aria-label="Details" data-tip="Show or hide the details" data-icon="panelRight"></button>
    <button type="button" class="icon-btn" id="settings-button" aria-haspopup="dialog" data-tip="Settings" aria-label="Settings" data-icon="settings"></button>
  </div>
  <nav class="side" id="side" aria-label="Sections"></nav>
  <div class="side-resize" id="side-resize" role="separator" aria-orientation="vertical" aria-label="Sidebar width" aria-valuemin="180" aria-valuemax="480" tabindex="0" data-tip="Drag to resize, double-click to reset"></div>
  <div class="results-bar" id="results-bar"></div>
  <div class="main-head" id="main-head"></div>
  <div class="body" id="body"></div>
  <aside class="details" id="details" aria-label="Details"></aside>
  <div class="status-bar" id="status-bar"></div>
  <div class="bulk-bar" id="bulk-bar" role="group" aria-label="Checked tabs" hidden>
    <span id="bulk-count" aria-live="polite"></span>
    <button type="button" class="btn" data-bulk="save">Save &amp; close</button>
    <button type="button" class="btn" data-bulk="move" aria-haspopup="menu" aria-expanded="false">Move to window ›</button>
    <button type="button" class="btn" data-bulk="remind" aria-haspopup="menu" aria-expanded="false">Remind me later ›</button>
    <button type="button" class="btn" data-bulk="suspend">Suspend</button>
    <button type="button" class="btn danger" data-bulk="close">Close</button>
    <button type="button" class="btn" data-bulk="clear">Clear</button>
  </div>
  <div class="undo-bar" id="undo-bar" role="status" hidden><span id="undo-text"></span><button type="button" class="btn" id="undo-button">Undo</button></div>
</main>

<dialog id="palette" class="palette" aria-label="Command palette">
  <input id="palette-field" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" aria-label="Command palette" placeholder="Type an action, a place or a tab…" autocomplete="off" spellcheck="false">
  <div id="palette-list" class="palette-list" role="listbox" aria-label="Commands"></div>
</dialog>

<div popover id="menu" class="menu" role="menu" aria-label="Actions"></div>

<div popover="manual" id="tip" class="tip" role="tooltip"></div>

<dialog id="topic-dialog" aria-labelledby="topic-label">
  <form method="dialog">
    <label id="topic-label" class="topic-field"><span id="topic-label-text">New topic</span> <input id="topic-name" type="text" required maxlength="60" autocomplete="off"></label>
    <div class="dialog-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn" value="ok" id="topic-ok">Create</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <form method="dialog">
    <button class="btn" value="cancel">Cancel</button>
    <button class="btn danger" value="ok" id="confirm-ok" autofocus>Close tabs</button>
  </form>
</dialog>
</body>
</html>
